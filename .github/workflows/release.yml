name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - run: corepack enable
      - run: corepack prepare pnpm@10.15.1 --activate
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm eval:agent
      - run: pnpm version:check
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
      - name: Agent model-backed smoke
        if: ${{ vars.NEXO_MODEL_EVAL_URL != '' }}
        env:
          NEXO_MODEL_EVAL_URL: ${{ vars.NEXO_MODEL_EVAL_URL }}
          NEXO_MODEL_EVAL_MODEL: ${{ vars.NEXO_MODEL_EVAL_MODEL }}
        run: pnpm eval:agent:model
      - run: pnpm --filter @nexo/shared build
      - run: pnpm --filter @nexo/browser-agent build
      - run: pnpm --filter @nexo/core build
      - run: pnpm --filter @nexo/desktop exec electron-builder --win nsis --publish always
      - run: node scripts/verify-installer.mjs
      - shell: powershell
        run: ./scripts/smoke-installer.ps1
