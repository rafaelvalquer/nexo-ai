name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22.20.0}
      - run: corepack enable
      - run: corepack prepare pnpm@10.15.1 --activate
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
      - run: pnpm package:win
      - shell: powershell
        run: ./scripts/smoke-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: NexoAI-Setup-Windows
          path: |
            release/NexoAI-Setup-*.exe
            release/NexoAI-Setup-*.exe.blockmap
          if-no-files-found: error
