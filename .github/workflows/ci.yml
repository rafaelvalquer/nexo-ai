name: CI
on: [push, pull_request]

jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.20.0 }
      - run: corepack enable
      - run: corepack prepare pnpm@10.15.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:security
      - run: pnpm eval:agent
      - run: pnpm version:check
      - run: pnpm build

  agent-model-smoke:
    needs: core
    runs-on: ubuntu-latest
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
    env:
      NEXO_MODEL_EVAL_URL: ${{ vars.NEXO_MODEL_EVAL_URL || 'http://127.0.0.1:11434' }}
      NEXO_MODEL_EVAL_MODEL: ${{ vars.NEXO_MODEL_EVAL_MODEL || 'qwen3:0.6b' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.20.0 }
      - run: corepack enable
      - run: corepack prepare pnpm@10.15.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pull local evaluation model
        if: ${{ vars.NEXO_MODEL_EVAL_URL == '' }}
        shell: bash
        run: bash scripts/ci/pull-ollama-model.sh
      - name: Agent model-backed smoke
        run: pnpm eval:agent:model

  hybrid-intent-model:
    needs: core
    runs-on: ubuntu-latest
    services:
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
    env:
      NEXO_MODEL_EVAL_URL: ${{ vars.NEXO_MODEL_EVAL_URL || 'http://127.0.0.1:11434' }}
      NEXO_MODEL_EVAL_MODEL: ${{ vars.NEXO_MODEL_EVAL_MODEL || 'qwen3:0.6b' }}
      NEXO_INTENT_MODEL: ${{ vars.NEXO_MODEL_EVAL_MODEL || 'qwen3:0.6b' }}
      NEXO_INTENT_P95_MAX_MS: "1500"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.20.0 }
      - run: corepack enable
      - run: corepack prepare pnpm@10.15.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pull local evaluation model
        if: ${{ vars.NEXO_MODEL_EVAL_URL == '' }}
        shell: bash
        run: bash scripts/ci/pull-ollama-model.sh
      - name: Hybrid intent model gate
        run: pnpm eval:intents:hybrid
      - name: Hybrid intent model summary
        if: always()
        shell: bash
        run: |
          if [ ! -f artifacts/hybrid-intent-eval.json ]; then
            echo "Hybrid Intent report was not generated." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Hybrid Intent Model Gate"
            echo
            echo "| Metric | Value |"
            echo "| --- | ---: |"
            echo "| Model | $(jq -r '.model // "unknown"' artifacts/hybrid-intent-eval.json) |"
            echo "| Cases | $(jq -r '.cases // 0' artifacts/hybrid-intent-eval.json) |"
            echo "| Operation accuracy | $(jq -r '((.operationAccuracy // 0) * 100 | tostring) + "%"' artifacts/hybrid-intent-eval.json) |"
            echo "| Entity accuracy | $(jq -r '((.entityAccuracy // 0) * 100 | tostring) + "%"' artifacts/hybrid-intent-eval.json) |"
            echo "| Wrong tool rate | $(jq -r '((.wrongToolRate // 0) * 100 | tostring) + "%"' artifacts/hybrid-intent-eval.json) |"
            echo "| Schema invalid rate | $(jq -r '((.schemaInvalidRate // 0) * 100 | tostring) + "%"' artifacts/hybrid-intent-eval.json) |"
            echo "| Ambiguity/negative safety | $(jq -r '((.ambiguitySafety // 0) * 100 | tostring) + "%"' artifacts/hybrid-intent-eval.json) |"
            echo "| Unsafe invented paths | $(jq -r '.unsafeInventedPaths // 0' artifacts/hybrid-intent-eval.json) |"
            echo "| P50 | $(jq -r '.p50Ms // 0' artifacts/hybrid-intent-eval.json) ms |"
            echo "| P90 | $(jq -r '.p90Ms // 0' artifacts/hybrid-intent-eval.json) ms |"
            echo "| P95 | $(jq -r '.p95Ms // 0' artifacts/hybrid-intent-eval.json) ms |"
            echo "| Max | $(jq -r '.maxMs // 0' artifacts/hybrid-intent-eval.json) ms |"
            echo "| Failures | $(jq -r '(.failures // []) | length' artifacts/hybrid-intent-eval.json) |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Hybrid Intent evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-intent-eval
          path: artifacts/hybrid-intent-eval.json
          if-no-files-found: warn

  desktop-e2e:
    needs: core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.20.0 }
      - run: corepack enable
      - run: corepack prepare pnpm@10.15.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e

  package:
    needs: [core, agent-model-smoke, hybrid-intent-model, desktop-e2e]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.20.0 }
      - run: corepack enable
      - run: corepack prepare pnpm@10.15.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm package:win
      - shell: powershell
        run: ./scripts/smoke-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: NexoAI-Setup-Windows
          path: |
            release/NexoAI-Setup-*.exe
            release/NexoAI-Setup-*.exe.blockmap
          if-no-files-found: error
