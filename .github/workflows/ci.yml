name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22.20.0}
      - run: corepack enable
      - run: corepack prepare pnpm@10.15.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:security
      - run: pnpm eval:agent
      - run: pnpm version:check
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
      - name: Agent model-backed smoke
        env:
          NEXO_MODEL_EVAL_URL: ${{ vars.NEXO_MODEL_EVAL_URL }}
          NEXO_MODEL_EVAL_MODEL: ${{ vars.NEXO_MODEL_EVAL_MODEL }}
        shell: powershell
        run: |
          if (-not $env:NEXO_MODEL_EVAL_URL) {
            throw "Configure NEXO_MODEL_EVAL_URL para executar o gate de modelo. O smoke não pode ser ignorado silenciosamente."
          }
          pnpm eval:agent:model
      - name: Hybrid intent model gate
        env:
          NEXO_MODEL_EVAL_URL: ${{ vars.NEXO_MODEL_EVAL_URL }}
          NEXO_MODEL_EVAL_MODEL: ${{ vars.NEXO_MODEL_EVAL_MODEL }}
        shell: powershell
        run: |
          if (-not $env:NEXO_MODEL_EVAL_URL) {
            throw "Configure NEXO_MODEL_EVAL_URL para executar o gate real do Hybrid Intent Resolver."
          }
          pnpm eval:intents:hybrid
      - run: pnpm package:win
      - shell: powershell
        run: ./scripts/smoke-installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: NexoAI-Setup-Windows
          path: |
            release/NexoAI-Setup-*.exe
            release/NexoAI-Setup-*.exe.blockmap
          if-no-files-found: error
